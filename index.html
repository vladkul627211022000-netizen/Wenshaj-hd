<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ozon Банк — демо</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef2f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  max-width:720px;
  margin:auto;
  min-height:100vh;
  background:#f4f6fa;
  padding-bottom:90px;
}

.top{
  height:90px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 20px;
  border-bottom:1px solid #e9edf2;
}

.logo{
  color:#1268e8;
  font-size:28px;
  font-weight:850;
}

.demo{
  color:#777;
  background:#edf3fc;
  padding:5px 7px;
  border-radius:7px;
  font-size:10px;
  margin-left:5px;
  font-weight:bold;
}

.open{
  border:0;
  background:#edf6ff;
  color:#1268e8;
  padding:12px 15px;
  border-radius:15px;
  font-weight:bold;
}

.banner{
  margin:18px 18px 15px;
  padding:26px;
  border-radius:27px;
  color:white;
  background:linear-gradient(135deg,#0868f5,#397ff7,#78b0ff);
  box-shadow:0 12px 30px #1268e833;
}

.banner h1{
  margin:0 0 18px;
  font-size:27px;
  line-height:1.15;
}

.banner button{
  border:0;
  background:white;
  color:#1268e8;
  padding:13px 20px;
  border-radius:15px;
  font-size:16px;
  font-weight:bold;
}

.cards{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 18px;
}

.card{
  background:white;
  border-radius:23px;
  padding:20px;
  box-shadow:0 5px 20px #00000008;
}

.card.bonus{
  background:linear-gradient(145deg,#fff,#f0f7ff);
  border:1px solid #d9e9ff;
}

.muted{
  color:#818b99;
  font-size:16px;
  font-weight:650;
}

.amount{
  margin-top:11px;
  font-size:30px;
  font-weight:850;
}

.blue{
  color:#1268e8;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:13px 18px;
}

.action{
  border:0;
  background:#e3f0ff;
  color:#1268e8;
  padding:17px 10px;
  border-radius:17px;
  font-size:18px;
  font-weight:bold;
}

.section{
  padding:14px 18px;
}

.section h2{
  font-size:27px;
  margin:0 0 14px;
}

.info{
  background:white;
  border-radius:22px;
  padding:18px;
  font-size:17px;
  font-weight:bold;
  box-shadow:0 5px 20px #00000008;
}

.icon{
  display:inline-flex;
  width:40px;
  height:40px;
  align-items:center;
  justify-content:center;
  background:#eaf4ff;
  border-radius:12px;
  margin-right:8px;
}

.search{
  margin:5px 18px 15px;
  background:white;
  color:#9aa3af;
  border-radius:19px;
  padding:18px;
  font-size:19px;
}

.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.product{
  background:white;
  border-radius:22px;
  padding:10px;
}

.pic{
  height:140px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:21px;
  font-weight:bold;
  background:linear-gradient(145deg,#62a2f5,#dcecff);
}

.product p{
  margin:10px 5px 5px;
  font-weight:bold;
}

.price{
  color:#1268e8;
  font-weight:bold;
  margin-left:5px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(720px,100%);
  height:75px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #e4e8ed;
  color:#929ca8;
  font-size:25px;
  z-index:10;
}

.bottom .active{
  color:#1268e8;
}

.notice{
  text-align:center;
  color:#858e99;
  font-size:11px;
  padding:10px 20px 15px;
}

/* ОКНО БОНУСОВ */

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:15px;
  z-index:50;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(600px,100%);
  background:white;
  border-radius:28px;
  padding:24px;
  animation:up .2s ease;
}

@keyframes up{
  from{transform:translateY(30px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.modal-title{
  font-size:25px;
  font-weight:850;
  margin-bottom:15px;
}

.close{
  float:right;
  border:0;
  background:#eef1f5;
  border-radius:50%;
  width:40px;
  height:40px;
  font-size:24px;
}

.modal-text{
  color:#505965;
  font-size:17px;
  line-height:1.5;
}

/* QR */

.qr-modal{
  position:fixed;
  inset:0;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:60;
}

.qr-modal.show{
  display:flex;
}

.qr-box{
  width:min(560px,100%);
  background:white;
  border-radius:28px;
  padding:20px;
}

.qr-title{
  font-size:24px;
  font-weight:850;
  margin-bottom:15px;
}

#video{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#111;
  border-radius:20px;
}

.qr-status{
  background:#f2f5f9;
  border-radius:15px;
  padding:14px;
  margin-top:12px;
  color:#626c78;
  font-size:14px;
}

.qr-result{
  display:none;
  margin-top:12px;
  padding:14px;
  background:#eaf4ff;
  border-radius:15px;
  color:#1268e8;
  word-break:break-all;
}

.qr-close{
  width:100%;
  margin-top:12px;
  border:0;
  padding:14px;
  border-radius:15px;
  background:#edf0f4;
  font-size:16px;
  font-weight:bold;
}

@media(max-width:500px){
  .logo{font-size:25px}
  .open{font-size:12px;padding:10px}
  .banner{margin:15px 16px}
  .cards{padding:0 16px}
  .actions{padding:12px 16px}
  .section{padding:14px 16px}
  .search{margin-left:16px;margin-right:16px}
}
</style>
</head>

<body>

<div class="app">
